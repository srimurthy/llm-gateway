version: 2
updates:
  - package-ecosystem: uv
    directory: /app
    schedule: { interval: weekly }
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /app
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directories: ["/infra/modules/*", "/infra/live/prod/*", "/infra/live/prod/*/*"]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
