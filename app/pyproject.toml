[project]
name = "llm-gateway"
version = "0.1.0"
description = "One OpenAI-compatible API over Amazon Bedrock, Azure OpenAI and self-hosted models, with token budgets and provider fallback."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
dependencies = [
  "aiobotocore>=2.15",
  "fastapi>=0.115",
  "openai>=3.30",
  "opentelemetry-api>=1.29",
  "opentelemetry-exporter-otlp-proto-grpc>=1.29",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "opentelemetry-sdk>=1.29",
  "prometheus-client>=0.21",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyyaml>=6.0",
  "redis>=5.2",
  "structlog>=24.4",
  "uvicorn[standard]>=0.54.0",
]

[project.scripts]
llm-gateway = "llm_gateway.__main__:main"
llm-gateway-worker = "llm_gateway.worker:main"

[dependency-groups]
dev = [
  "fakeredis[lua]>=2.40.0",
  "httpx>=0.28",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "types-aiobotocore[bedrock-runtime,dynamodb,secretsmanager,sqs]>=3.9.2",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "DTZ", "E", "EM", "F", "FAST", "G", "I",
  "LOG", "N", "PERF", "PIE", "PL", "PT", "PTH", "RET", "RUF", "S", "SIM", "T20", "TRY",
  "UP", "W",
]
ignore = [
  "PLR0913", # keyword-only constructors with many collaborators are deliberate
  "TRY003",  # exception messages carry request-specific context
  "EM101",   # same reason as TRY003
  "EM102",   # same reason as TRY003
  "TRY400",  # expected failures log without a traceback on purpose; exc_info is explicit
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004", "PLR0917", "ARG", "S105", "S106", "SLF001"]

[tool.ruff.lint.isort]
known-first-party = ["llm_gateway"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["llm_gateway"]

[[tool.mypy.overrides]]
module = ["fakeredis.*", "opentelemetry.instrumentation.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config -ra"
filterwarnings = ["error", "ignore::DeprecationWarning:botocore.*"]

[tool.coverage.run]
source = ["llm_gateway"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
