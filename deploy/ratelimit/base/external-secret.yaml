apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: valkey-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: VALKEY_SECRET_ID_SET_BY_OVERLAY
