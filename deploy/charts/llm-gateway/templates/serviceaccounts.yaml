# Bound to IAM roles by EKS Pod Identity associations (infra/modules/gateway-iam).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.api.serviceAccountName }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.worker.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.worker.serviceAccountName }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
