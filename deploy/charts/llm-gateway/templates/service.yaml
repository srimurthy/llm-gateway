apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-gateway.name" . }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "llm-gateway.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      appProtocol: http
