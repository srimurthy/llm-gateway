# Valkey AUTH token from Secrets Manager (created by infra/modules/valkey).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.valkey.authSecretName }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: {{ .Values.valkey.authSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ required "valkey.authSecretId is required" .Values.valkey.authSecretId | quote }}
