apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-gateway.name" . }}-api
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "llm-gateway.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "llm-gateway.selector" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        {{- include "llm-gateway.podAnnotations" . | nindent 8 }}
        # Keep the sidecar serving while the app drains open streams.
        proxy.istio.io/config: '{"terminationDrainDuration": "{{ .Values.api.shutdownTimeoutSeconds }}s"}'
    spec:
      serviceAccountName: {{ .Values.api.serviceAccountName }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "llm-gateway.selector" . | nindent 14 }}
              app.kubernetes.io/component: api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "llm-gateway.selector" . | nindent 14 }}
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: {{ include "llm-gateway.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["llm-gateway"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- include "llm-gateway.env" . | nindent 12 }}
            - name: LLMGW_SHUTDOWN_TIMEOUT_S
              value: {{ .Values.api.shutdownTimeoutSeconds | quote }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              # Let endpoint removal reach every Envoy before uvicorn stops accepting.
              exec:
                command: ["sleep", "10"]
          volumeMounts:
            - name: routing
              mountPath: /etc/llm-gateway
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: routing
          configMap:
            name: {{ include "llm-gateway.name" . }}-routing
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
