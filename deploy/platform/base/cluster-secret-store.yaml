# External Secrets authenticates with EKS Pod Identity (no static credentials). Its IAM
# role can read only the secrets listed in infra/modules/platform (Valkey AUTH, ingress TLS).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: REGION_SET_BY_OVERLAY
