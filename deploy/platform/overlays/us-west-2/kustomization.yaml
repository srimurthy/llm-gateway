# Values from `terraform output` in infra/live/prod/us-west-2/foundation.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: ClusterSecretStore
      name: aws-secrets-manager
    patch: |-
      - op: replace
        path: /spec/provider/aws/region
        value: us-west-2
  - target:
      kind: EC2NodeClass
    patch: |-
      - op: replace
        path: /spec/role
        value: llmgw-prod-usw2-karpenter-node
      - op: replace
        path: /spec/subnetSelectorTerms/0/tags/karpenter.sh~1discovery
        value: llmgw-prod-usw2
      - op: replace
        path: /spec/securityGroupSelectorTerms/0/tags/karpenter.sh~1discovery
        value: llmgw-prod-usw2
